plugins {
    // The remapping Loom: Minecraft 1.21.1 is obfuscated, the JAR is remapped to intermediary names. 1.15 and later
    // need a newer Gradle than this project's 9.2.1.
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
    id 'maven-publish'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

loom {
    mixin {
        // A refmap in the JAR: Sinytra Connector maps the mixins' targets from it (without one the EditBox mixin
        // found nothing to wrap under Connector).
        useLegacyMixinAp = true
        defaultRefmapName = "${mod_id}.refmap.json"
    }
}

// Local development runs (tests in the modpack, gallery shots), when present; not in the public repository.
if (file('devtest.gradle').exists()) apply from: 'devtest.gradle'

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // The settings button in the mod list (Mod Menu on Fabric, Connector Extras' bridge on NeoForge).
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"

    // Unit tests of the mod's logic (src/test/java): no game window, run by `gradlew build` and on GitHub.
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // The tests read the mod's resources and sources from the project folder (they do not run in it).
    systemProperty 'teyvatcartographia.projectDir', layout.projectDirectory.asFile.absolutePath
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

processResources {
    def props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            minecraft_version_range: minecraft_version_range,
            loader_version         : loader_version,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

// The file is named with a "v" before the version (teyvatcartographia-v0.5.0...jar); the mod's own version has none.
tasks.named('remapJar') {
    archiveVersion = "v${project.version}"
}
tasks.named('jar') {
    archiveVersion = "v${project.version}"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Full debug information: Sinytra Connector's mixin adapter reads the local variable tables of the mixin's methods
    // and stopped the game without them (26.10.2026; until 0.4 'source,lines' saved 58 KB).
    options.debugOptions.debugLevel = 'source,lines,vars'
}
