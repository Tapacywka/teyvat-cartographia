plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom-remap'
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

loom {
    mixin {
        // A refmap in the JAR: Sinytra Connector maps the mixins' targets from it (without one the EditBox mixin
        // found nothing to wrap under Connector).
        useLegacyMixinAp = true
        defaultRefmapName = "${mod_id}.refmap.json"
    }
}

// Local development runs (tests in the modpack, gallery shots), when present; not in the public repository.
if (rootProject.file('devtest-fabric.gradle').exists()) apply from: rootProject.file('devtest-fabric.gradle')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // The settings button in the mod list (Mod Menu on Fabric, Connector Extras' bridge on NeoForge).
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    // The settings screen and file (Actually Amazing Config Screen): a mod of its own the player installs beside this one
    // (inside the JAR from 0.9.0 to 1.3.2), required in fabric.mod.json.
    modImplementation "net.tapacywka.aacs:aacs-fabric:${aacs_version}+mc${minecraft_version}-fabric"
}

processResources {
    def props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            minecraft_version_range: fabric_minecraft_range,
            aacs_min_version       : aacs_min_version,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

// The released file is the remapped one, named like the plain JAR (multiloader-common).
tasks.named('remapJar') {
    archiveVersion = "v${project.version}"
}

tasks.named('compileJava', JavaCompile) {
    // With the tables of local variable names: Sinytra Connector's mixin adapter reads them in a mixin's methods and
    // stopped the game without them. All of it, not the mixins alone: a second compilation of the mixins put into the
    // JAR by path was fragile, and the tables cost about 60 KB.
    options.debugOptions.debugLevel = 'source,lines,vars'
}

// The released JAR's mixins keep those tables after remapping: the build fails otherwise (part of `check`).
def checkMixinVariables = tasks.register('checkMixinVariables') {
    def jar = tasks.named('remapJar').flatMap { it.archiveFile }
    inputs.file(jar)
    doLast {
        def mixins = 0
        new java.util.zip.ZipFile(jar.get().asFile).withCloseable { zip ->
            zip.entries().findAll { it.name.contains('/fabric/mixin/') && it.name.endsWith('.class') }.each { e ->
                mixins++
                def text = new String(zip.getInputStream(e).bytes, 'ISO-8859-1')
                if (!text.contains('LocalVariableTable')) throw new GradleException("${e.name} has no local variable table: Connector cannot adapt it")
            }
        }
        if (mixins == 0) throw new GradleException('No mixin classes in the JAR')
        logger.lifecycle("Mixins with local variable tables: ${mixins}")
    }
}
tasks.named('check') { dependsOn checkMixinVariables }
