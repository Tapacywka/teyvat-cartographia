plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

// Local development runs (tests in the modpack, gallery shots), when present; not in the public repository.
if (rootProject.file('devtest-fabric.gradle').exists()) apply from: rootProject.file('devtest-fabric.gradle')

dependencies {
    // Minecraft 26.x ships with Mojang's names: no mappings, no remapping (the JAR is the compiled one).
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // The settings button in the mod list (Mod Menu on Fabric, Connector Extras' bridge on NeoForge).
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    // The settings screen and file (Actually Amazing Config Screen): a mod of its own the player installs beside this one
    // (user decision 14.11.2026; inside the JAR from 0.9.0 to 1.3.2), required in fabric.mod.json.
    implementation "net.tapacywka.aacs:aacs-fabric:${aacs_version}+mc${minecraft_version}-fabric"
}

processResources {
    def props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            minecraft_version_range: fabric_minecraft_range,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    // Source file names and line numbers (crash reports still point at the line), no tables of local variable names:
    // no mixins on this branch, the only classes Sinytra Connector needs them in (03.11.2026).
    options.debugOptions.debugLevel = 'source,lines'
}
