plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom-remap'
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

loom {
    mixin {
        // A refmap in the JAR: Sinytra Connector maps the mixins' targets from it (without one the EditBox mixin
        // found nothing to wrap under Connector).
        useLegacyMixinAp = true
        defaultRefmapName = "${mod_id}.refmap.json"
    }
}

// Local development runs (tests in the modpack, gallery shots), when present; not in the public repository.
if (rootProject.file('devtest-fabric.gradle').exists()) apply from: rootProject.file('devtest-fabric.gradle')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // The settings button in the mod list (Mod Menu on Fabric, Connector Extras' bridge on NeoForge).
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    // The settings screen and file (Actually Amazing Config Screen), inside the JAR.
    modImplementation "net.tapacywka.aacs:aacs-fabric:${aacs_version}+mc${minecraft_version}-fabric"
    include "net.tapacywka.aacs:aacs-fabric:${aacs_version}+mc${minecraft_version}-fabric"
}

processResources {
    def props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            minecraft_version_range: fabric_minecraft_range,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

// The released file is the remapped one, named like the plain JAR (multiloader-common).
tasks.named('remapJar') {
    archiveVersion = "v${project.version}"
}

tasks.named('compileJava', JavaCompile) {
    // Source file names and line numbers (crash reports still point at the line), no tables of local variable names
    // but in the mixins (below): about 60 KB less (03.11.2026).
    options.debugOptions.debugLevel = 'source,lines'
}

// Sinytra Connector's mixin adapter reads the local variable tables of a mixin's methods and stopped the game without
// them (26.10.2026): the mixins compiled once more with them (no annotation processing, the refmap is compileJava's),
// and these classes go into the JAR instead (also the test JAR of the Connector runs, devtest-fabric.gradle).
def mixinSources = 'net/tapacywka/teyvatcartographia/fabric/mixin/'
def mixinsWithVars = tasks.register('compileMixinsWithVars', JavaCompile) {
    dependsOn tasks.named('compileJava')
    source = sourceSets.main.java.matching { include "${mixinSources}**" }
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output.classesDirs
    destinationDirectory = layout.buildDirectory.dir('mixinsWithVars')
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
    options.debugOptions.debugLevel = 'source,lines,vars'
}
ext.mixinsWithVars = mixinsWithVars
ext.withMixinVars = { Jar jar ->
    def mainClasses = sourceSets.main.output.classesDirs.files
    jar.dependsOn mixinsWithVars
    jar.exclude { e -> e.path.startsWith(mixinSources) && mainClasses.any { e.file.toPath().startsWith(it.toPath()) } }
    // The classes folder only: the task's outputs also hold the compiler's incremental data (167 KB).
    jar.from(mixinsWithVars.flatMap { it.destinationDirectory })
}
tasks.named('jar', Jar) { withMixinVars(it) }
