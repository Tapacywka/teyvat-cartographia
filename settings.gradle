pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenLocal()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'teyvat-map'

// One code for two loaders: common/src (no Gradle project of its own) is compiled by each loader's build as its
// own sources, so a loader's API used in common code breaks the other build at once.
include 'fabric', 'neoforge'
