name: Build

on:
  # Only for a release (user rule 03.11.2026): the version tags, main's v<version> and mc26's v<version>+mc26, or by hand.
  push:
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Every 26.x game of this branch (versions/<game>.properties; 26.1.2 is the one of gradle.properties).
    strategy:
      fail-fast: false
      matrix:
        game: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Actually Amazing Config Screen (the settings screen, a required mod of its own), at the version gradle.properties
      # names (its mc26 branch, tag v<version>+mc26, built for this job's game), into the local Maven repository the build
      # reads it from.
      - name: Actually Amazing Config Screen
        run: |
          v=$(grep '^aacs_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          git clone --depth 1 --branch "v$v+mc26" https://github.com/Tapacywka/actually-amazing-config-screen.git ../aacs
          cd ../aacs && chmod +x gradlew && ./gradlew publishToMavenLocal --no-daemon -Pmc=${{ matrix.game }}

      # The JARs only (Fabric and NeoForge); the unit tests run in test.yml.
      - name: Build the mod
        run: ./gradlew assemble --no-daemon -Pmc=${{ matrix.game }}

      - name: Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: teyvatcartographia-${{ matrix.game }}-fabric-jar
          path: fabric/build/libs/teyvatcartographia-v*.jar

      - name: NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: teyvatcartographia-${{ matrix.game }}-neoforge-jar
          path: neoforge/build/libs/teyvatcartographia-v*.jar
