name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The JARs only (Fabric and NeoForge); the unit tests run in test.yml.
      - name: Build the mod
        run: ./gradlew assemble --no-daemon

      - name: Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: teyvatcartographia-fabric-jar
          path: fabric/build/libs/teyvatcartographia-v*.jar

      - name: NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: teyvatcartographia-neoforge-jar
          path: neoforge/build/libs/teyvatcartographia-v*.jar
