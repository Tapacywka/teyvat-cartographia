name: Build

on:
  # A release (the version tags, main's v<version> and mc26's v<version>+mc26), a pull request into mc26 (its JARs to
  # try in game), or by hand. Ordinary pushes run nothing.
  push:
    tags: [v*]
  pull_request:
    branches: [mc26]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request stops the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Every 26.x game of this branch (versions/<game>.properties; 26.1.2 is the one of gradle.properties).
    strategy:
      fail-fast: false
      matrix:
        game: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      # Actually Amazing Config Screen (the settings screen, a required mod of its own), at the version gradle.properties
      # names (its mc26 branch, tag v<version>+mc26, built for this job's game), into the local Maven repository the build
      # reads it from. A version not tagged yet (a dev version in a pull request) is built from AACS's branch mc26 under that
      # version; on a version tag that fails the run.
      - name: Actually Amazing Config Screen
        run: |
          v=$(grep '^aacs_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          repo=https://github.com/Tapacywka/actually-amazing-config-screen.git
          if ! git clone --depth 1 --branch "v$v+mc26" "$repo" ../aacs; then
            # A release builds against a released AACS only: without its tag the run stops instead of taking the branch.
            if [ "${{ github.ref_type }}" = "tag" ]; then echo "::error::AACS v$v+mc26 has no tag yet: push it before the release tag"; exit 1; fi
            git clone --depth 1 --branch mc26 "$repo" ../aacs
          fi
          cd ../aacs && chmod +x gradlew && ./gradlew publishToMavenLocal --no-daemon -Pmc=${{ matrix.game }} -Pmod_version="$v"

      # The JARs only (Fabric and NeoForge); the unit tests run in test.yml.
      - name: Build the mod
        run: ./gradlew assemble --no-daemon -Pmc=${{ matrix.game }}

      - name: Fabric JAR
        uses: actions/upload-artifact@v7
        with:
          name: teyvatcartographia-${{ matrix.game }}-fabric-jar
          path: fabric/build/libs/teyvatcartographia-v*.jar

      - name: NeoForge JAR
        uses: actions/upload-artifact@v7
        with:
          name: teyvatcartographia-${{ matrix.game }}-neoforge-jar
          path: neoforge/build/libs/teyvatcartographia-v*.jar
