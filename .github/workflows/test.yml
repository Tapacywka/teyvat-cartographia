name: Test

on:
  # A release (the version tags, main's v<version> and mc26's v<version>+mc26), a pull request into main, or by hand.
  # Ordinary pushes run nothing.
  push:
    tags: [v*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request stops the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Actually Amazing Config Screen (the settings screen, a required mod of its own), at the version gradle.properties
      # names, into the local Maven repository the build reads it from. A version not tagged yet (a dev version in a pull
      # request) is built from AACS's default branch under that version.
      - name: Actually Amazing Config Screen
        run: |
          v=$(grep '^aacs_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          repo=https://github.com/Tapacywka/actually-amazing-config-screen.git
          git clone --depth 1 --branch "v$v" "$repo" ../aacs || git clone --depth 1 "$repo" ../aacs
          cd ../aacs && chmod +x gradlew && ./gradlew publishToMavenLocal --no-daemon -Pmod_version="$v"

      - name: Run the unit tests
        run: ./gradlew test --no-daemon

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: common/build/reports/tests/test/
          if-no-files-found: ignore
