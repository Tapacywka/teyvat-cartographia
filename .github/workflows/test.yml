name: Test

on:
  push:
    branches: [main, mc26]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The unit tests against every 26.x game of this branch.
    strategy:
      fail-fast: false
      matrix:
        game: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the unit tests
        run: ./gradlew test --no-daemon -Pmc=${{ matrix.game }}

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.game }}
          path: common/build/reports/tests/test/
          if-no-files-found: ignore
