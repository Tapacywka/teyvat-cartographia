modLoader="javafml"
loaderVersion="*"
license="${mod_license}"
issueTrackerURL="https://github.com/Tapacywka/teyvat-cartographia/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://modrinth.com/project/teyvat-cartographia"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="logo.png"
# The square icon of the mod list (NeoForge 26.2 and later; earlier ones read logoFile only)
iconFile="logo.png"
iconBlur=true

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="aacs"
    type="required"
    versionRange="[1.2.0,)"
    ordering="NONE"
    side="BOTH"
