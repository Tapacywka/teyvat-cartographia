plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    enable {
        version = project.neo_version
        // Local runs with mods whose mixins target vanilla lambdas (the Aether's Accessories) need the game's own
        // classes: the recompiled ones number their lambdas differently. -PbinaryGame=true
        disableRecompilation = project.findProperty('binaryGame') == 'true'
    }

    // The access transformer is common/'s (packed into this JAR with its resources, named in neoforge.mods.toml).
    accessTransformers.from(project(':common').file('src/main/resources/META-INF/accesstransformer.cfg'))

    runs {
        client {
            client()
            gameDirectory = rootProject.file('run')
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Local development runs (tests in the modpack, gallery shots), when present; not in the public repository.
if (rootProject.file('devtest-neoforge.gradle').exists()) apply from: rootProject.file('devtest-neoforge.gradle')

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

processResources {
    def props = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    // Source file names and line numbers (crash reports still point at the line), no tables of local variable names:
    // 58 KB less in the JAR.
    options.debugOptions.debugLevel = 'source,lines'
}
