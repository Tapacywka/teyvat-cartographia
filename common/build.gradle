// The code and resources of both loaders, compiled here against the game alone (NeoForm: Minecraft without a loader),
// so a loader's API used in them fails at once. The unit tests of the mod's logic run here, without a window.
plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    enable {
        neoFormVersion = project.neo_form_version
    }
    // The fields of the game the mod reaches (NeoForge reads the same file from the JAR, Fabric has its own
    // access widener with the same entries).
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
    // The unit tests use the game's classes too (codecs, keys, registries).
    addModdingDependenciesTo(sourceSets.test)
}

// What the loaders compile and pack as their own (multiloader-loader).
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    // main and this game's own folder (src/mc<game>/java, multiloader-common)
    // (or, for a game with versions/<game>.renames, the renamed copy of main, made by renameSources)
    def rename = tasks.findByName('renameSources')
    sourceSets.main.java.srcDirs.each { dir ->
        if (rename != null && dir == rename.destinationDir) commonJava(dir) { builtBy rename }
        else if (dir.exists()) commonJava dir
    }
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

dependencies {
    // Unit tests of the mod's logic: run by `gradlew build` and on GitHub.
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // The tests read the mod's resources and sources from here.
    systemProperty 'teyvatcartographia.projectDir', projectDir.absolutePath
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}
