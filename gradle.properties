# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parameter names for the Mojang mappings: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
minecraft_version=1.21.1
# The game without a loader that common/ is compiled against: https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# NeoForge
minecraft_version_range=[1.21.1]
neo_version=21.1.257
neo_version_range=[21.1.0,)
loader_version_range=[4,)
# Fabric
fabric_minecraft_range=~1.21.1
fabric_loader_version=0.20.1
fabric_api_version=0.116.17+1.21.1
modmenu_version=11.0.3

## Mod Properties
mod_id=teyvatcartographia
mod_name=Teyvat Cartographia
mod_license=MIT
# The version without the game and loader: each loader's build adds +mc<version>-<loader>.
mod_version=0.8.0-dev.1
mod_group_id=net.tapacywka.teyvatcartographia
mod_authors=Tapacywka
mod_description=A Genshin Impact inspired world map and minimap: painted explored map, cave layers, pins, waypoints in the world and a walking path.
